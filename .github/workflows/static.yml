# Publish only reviewed bytes after mandatory content and real-browser checks.
name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification tools
        run: |
          python -m pip install --disable-pip-version-check -r .github/site-security/security/requirements.txt
          npm install --prefix .github/site-security/security --ignore-scripts --omit=optional --no-audit --no-fund --no-package-lock
          node .github/site-security/security/node_modules/playwright/cli.js install --with-deps chromium
      - name: Stage only reviewed public files and inspect actual payloads
        run: python .github/site-security/independent/stage_pages.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/approved-site"
      - name: Reject known bypasses
        run: python .github/site-security/independent/check_regressions.py "$RUNNER_TEMP/approved-site/servicelife-ja"
      - name: Verify real protection and CSP in Chromium
        run: node .github/site-security/independent/browser_gate.cjs "$RUNNER_TEMP/approved-site"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Name this build artifact
        id: artifact-name
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Recheck the exact artifact immediately before upload
        run: python .github/site-security/independent/stage_pages.py --verify "$RUNNER_TEMP/approved-site"
      - name: Upload verified artifact only
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/approved-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
