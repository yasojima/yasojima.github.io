<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ServiceLife 日本語デモ</title>
<style>
  :root { color-scheme:light; font:17px/1.75 system-ui,sans-serif; color:#183321; background:#f6f8f6 }
  body { margin:0 }
  main { max-width:32rem; margin:clamp(36px,12vh,128px) auto; padding:0 24px }
  h1 { font-size:clamp(1.8rem,5vw,2.55rem); line-height:1.25; margin:0 0 1rem }
  a { color:#225b32; text-underline-offset:.2em }
  .open { display:inline-block; margin:.25rem 0 1.4rem; padding:10px 23px; border-radius:7px; background:#245e34; color:white; font-weight:650; text-decoration:none }
  a:focus-visible,summary:focus-visible { outline:3px solid #235ebb; outline-offset:4px }
  details { padding:.85rem 0; border-top:1px solid #c9d5cc; font-size:.92rem }
  summary { cursor:pointer; width:fit-content }
  footer { margin-top:1rem; font-size:.85rem }
</style>
<main>
  <h1>ServiceLife 日本語デモ</h1>
  <p>Macの「ServiceLife 日本語」で公式デモを開きます。予約カレンダー、顧客、スタッフの地図などを元の画面のまま操作できます。</p>
  <a class="open" href="servicelife-ja://open">日本語デモ全体を開く</a>
  <details>
    <summary>別のMacで初めて開く場合</summary>
    <p>AppleシリコンのMacとXcodeコマンドラインツールをお使いください。ビューア一式を展開し、「日本語で開く.command」を開くと、初回だけ翻訳モデルを取得します。次回からは上のボタンで開けます。</p>
    <p><a href="./servicelife-ja-viewer.zip" download>日本語ビューア一式をダウンロード</a></p>
  </details>
  <footer><a href="https://demo.servicelife.app/calendar/">ServiceLife公式デモ</a></footer>
</main>
</html>
