<!doctype html>
<html lang="ja">
<head><meta name="robots" content="noindex,nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お客様の作業確認とお支払い</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f6fa;color:#2d3436;font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
    .review-board{width:1540px;padding:44px 90px 40px}
    .screens{display:grid;grid-template-columns:repeat(3,390px);gap:32px;justify-content:center}
    .screen{min-width:0}
    h1{font-size:17px;font-weight:700;line-height:1.6;margin:0 0 20px;color:#1b5e20;white-space:nowrap}
    iframe{display:block;width:390px;height:1300px;border:0;border-radius:8px;box-shadow:0 0 0 1px #dfe6e9;background:#f5f6fa}
  </style>
</head>
<body>
  <main class="review-board">
    <div class="screens">
      <section class="screen"><h1>1 内容・金額を確認して氏名入力</h1><iframe id="customer-before" title="内容と金額の確認・氏名入力" src="customer.html?state=filled"></iframe></section>
      <section class="screen"><h1>2 確認済み・お支払いへ</h1><iframe id="customer-confirmed" title="確認済み・お支払い" src="customer.html?state=confirmed"></iframe></section>
      <section class="screen"><h1>3 氏名・確認日時をPDFへ反映</h1><iframe id="customer-pdf" title="氏名と確認日時を反映した請求書" src="customer.html?state=confirmed&amp;invoice=open"></iframe></section>
    </div>
  </main>
  <script>
    document.querySelectorAll('iframe').forEach(frame => frame.addEventListener('load', () => {
      try {
        const rough = frame.contentWindow.customerRough;
        if (frame.id === 'customer-before') rough.setState({ name: frame.contentWindow.EXOPS_CUSTOMER_SAMPLE.profile.name, checked: true });
        else rough.setState('confirmed');
        if (frame.id === 'customer-pdf') rough.openInvoice();
      } catch (_) { /* Local-file capture initializes each frame directly. */ }
    }));
  </script>
</body>
</html>
