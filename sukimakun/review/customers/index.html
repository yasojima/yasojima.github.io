<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <link rel="icon" href="data:,">
  <title>ラフ一覧 | SUKIMAKUN</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", "Yu Gothic", sans-serif; color: #2d363a; background: #f4f6fa; }
    * { box-sizing: border-box; }
    body { margin: 0; font-size: 16px; line-height: 1.6; }
    .page-header { background: #1b5e20; color: #fff; }
    .page-header-inner, main { width: min(100%, 1540px); margin-inline: auto; padding-inline: 32px; }
    .page-header-inner { display: flex; align-items: center; min-height: 80px; }
    .wordmark { margin: 0; font-size: 25px; line-height: 1.2; font-weight: 800; letter-spacing: .02em; }
    main { padding-block: 36px 48px; }
    h1 { margin: 0 0 24px; font-size: 24px; line-height: 1.5; font-weight: 700; }
    .rough-list { min-height: 320px; display: grid; place-items: center; padding: 32px; background: #fff; border: 1px solid #dce3e9; border-radius: 8px; }
    .empty-state { margin: 0; color: #647178; text-align: center; }
    @media (max-width: 600px) {
      .page-header-inner, main { padding-inline: 20px; }
      .page-header-inner { min-height: 72px; }
      .wordmark { font-size: 23px; }
      main { padding-block: 28px; }
      h1 { font-size: 22px; margin-bottom: 20px; }
      .rough-list { min-height: 280px; padding: 24px; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="page-header-inner"><p class="wordmark">SUKIMAKUN</p></div>
  </header>
  <main>
    <h1>ラフ一覧</h1>
    <section id="rough-list" class="rough-list" aria-label="確認用ラフ">
      <!-- ラフを公開するときに、この空表示を各ラフへの一覧に置き換える。 -->
      <p class="empty-state">ラフはまだありません。</p>
    </section>
  </main>
</body>
</html>
